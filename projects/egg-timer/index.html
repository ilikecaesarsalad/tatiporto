*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{background:#3d2a28;color:#50301e;font-family:'Press Start 2P',monospace;overflow:hidden;-webkit-font-smoothing:none;user-select:none}
.bg_tatiana{position:fixed;inset:0;background:var(--kitchen) center/cover no-repeat}
.screen_tatiana{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.warm_tatiana{position:absolute;inset:0;background:rgba(255,232,210,.18);pointer-events:none}
.container_tatiana{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:calc(2px + env(safe-area-inset-top)) 14px 4px}
.cook_tatiana{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.water_tatiana{position:absolute;left:0;right:0;bottom:0;height:32%;background:#7ec8e8;opacity:.14}
.glow_tatiana{position:absolute;bottom:-28px;left:50%;margin-left:-140px;width:280px;height:180px;border-radius:120px;background:#ffd685;transition:opacity 1s}
.bubble_tatiana{position:absolute;bottom:28px;border-radius:99px;background:#fff6e6;border:1px solid #ffe6b6;will-change:transform,opacity}
.steam_tatiana{position:absolute;bottom:36px;width:50px;height:50px;border-radius:25px;background:#fff6ef;will-change:transform,opacity}
.top_tatiana{width:100%;display:flex;justify-content:center;z-index:2}
.title_tatiana{position:relative;margin:2px 0;min-height:36px;text-align:center}
.title_tatiana span{display:block;font-size:22px;line-height:32px;letter-spacing:2px;white-space:nowrap}
.title_tatiana .t_tatiana{position:relative;color:#fffef5}
.title_tatiana .s1_tatiana,.title_tatiana .s2_tatiana{position:absolute;left:0;right:0}
.title_tatiana .s2_tatiana{top:6px;color:#b56576}.title_tatiana .s1_tatiana{top:3px;color:#e8899a}
.oven_tatiana{flex:1;width:100%;min-height:0;z-index:2;padding-top:5%;overflow-y:auto;scrollbar-width:none}
.oven_tatiana::-webkit-scrollbar{display:none}
.ovenScroll_tatiana{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-bottom:12px}
.portal_tatiana{padding:5px;border-radius:26px;border:3px solid #a67c52;background:rgba(45,32,28,.38);margin-bottom:10px;width:100%;max-width:300px}
.rim_tatiana{border-radius:22px;border:2px solid rgba(255,236,210,.85);padding:10px 8px;background:rgba(255,245,230,.12);display:flex;justify-content:center}
.cluster_tatiana{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.dglow_tatiana{position:absolute;width:228px;height:228px;border-radius:114px;background:#ffd25a;opacity:0;transform:scale(.88)}
.dglow_tatiana.go_tatiana{animation:dglow 1.22s ease-out}
@keyframes dglow{0%{opacity:0;transform:scale(.88)}26%{opacity:.5;transform:scale(1.08)}100%{opacity:0;transform:scale(.88)}}
.eggFrame_tatiana{position:relative;margin:4px 0;width:184px;height:184px;border-radius:92px;background:rgba(255,241,219,.92);border:3px solid #e8b88a;display:flex;align-items:center;justify-content:center;transition:border-color .4s,background-color .4s}
.eggFrame_tatiana.cooking_tatiana{border-color:#e8a86c;background:rgba(255,236,218,.94)}
.eggFrame_tatiana.bounce_tatiana{animation:bounce .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.06)}65%{transform:scale(.99)}100%{transform:scale(1)}}
.eggFrame_tatiana img{width:168px;height:168px;object-fit:contain;image-rendering:auto;transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.eggFrame_tatiana img.swap_tatiana{opacity:0;transform:scale(.85)}
.eggFrame_tatiana.cooking_tatiana img{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.panel_tatiana{width:100%;border-radius:24px;background:rgba(255,244,222,.92);border:3px solid #f0c4a8;padding:14px;margin-bottom:12px}
.time_tatiana{color:#5a2d0f;font-size:32px;line-height:42px;text-align:center;letter-spacing:1px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.track_tatiana{height:18px;border-radius:10px;border:2px solid #d38c2e;background:#ffe5a5;overflow:hidden}
.fill_tatiana{height:100%;width:0;background:#ffb22c;border-right:2px solid #f9d07d;transition:width .3s ease}
.fill_tatiana.shimmer_tatiana{transition:width 1s linear}
.fill_tatiana.shimmer_tatiana{animation:shim 4.4s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.9}50%{opacity:.98}}
.controls_tatiana{display:flex;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.pbtn_tatiana{margin:0 6px;border-radius:16px;min-width:132px;max-width:200px;padding:12px 14px;border:2px solid;font:inherit;font-size:8px;line-height:14px;letter-spacing:.5px;color:#50301e;cursor:pointer;text-align:center;transition:transform .12s,filter .15s}
.pbtn_tatiana:hover{filter:brightness(1.04)}
.pbtn_tatiana:active{transform:scale(.97)}
.pbtn_tatiana:focus-visible,.card_tatiana:focus-visible{outline:3px solid #fff4e0;outline-offset:2px}
.primary_tatiana{background:#ffcf72;border-color:#d69436}.danger_tatiana{background:#ffc0b8;border-color:#d6897c}
.selector_tatiana{width:100%;padding-top:4px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:2}
.row_tatiana{display:flex;overflow-x:auto;padding:0 8px 2px;scrollbar-width:none;scroll-snap-type:x proximity;cursor:grab}
.row_tatiana::-webkit-scrollbar{display:none}
.cardWrap_tatiana{margin:0 8px;border-radius:20px;flex:none;scroll-snap-align:center;background:none;border:0;font:inherit;cursor:pointer;transition:transform .12s}
.cardWrap_tatiana:active:not(:disabled){transform:scale(.97)}
.cardWrap_tatiana:disabled{cursor:not-allowed}
.card_tatiana{width:158px;border-radius:20px;padding:10px 12px;background:#fff4de;border:2px solid #f1cf95;display:flex;flex-direction:column;align-items:center;transition:background-color .25s,border-color .25s,opacity .3s}
.card_tatiana.active_tatiana{background:#ffe9b8;border-color:#e1a541}
.cardWrap_tatiana:disabled .card_tatiana{opacity:.55}
.card_tatiana img{width:78px;height:78px;object-fit:contain;margin-bottom:8px}
.card_tatiana .l_tatiana{color:#74492d;font-size:8px;line-height:14px;text-align:center}
.card_tatiana.active_tatiana .l_tatiana{color:#5a2f10}
.card_tatiana .m_tatiana{margin-top:2px;color:#9a6f45;font-size:7px;line-height:12px}
.alarm_tatiana{position:fixed;inset:0;background:rgba(34,17,17,.56);display:flex;align-items:center;justify-content:center;padding:0 24px;z-index:50;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.alarm_tatiana.show_tatiana{opacity:1;visibility:visible}
.acard_tatiana{width:100%;max-width:320px;background:rgba(255,245,226,.96);border-radius:18px;border:4px solid #a84c3d;padding:24px 20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.28);transform:scale(.85);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.alarm_tatiana.show_tatiana .acard_tatiana{transform:none;animation:ring 1.2s .4s ease-in-out infinite}
@keyframes ring{0%,100%{rotate:0deg}10%{rotate:-2deg}20%{rotate:2deg}30%{rotate:-1deg}40%{rotate:0deg}}
.atitle_tatiana{font-size:20px;line-height:28px;color:#7a241e;margin-bottom:12px}
.asub_tatiana{font-size:10px;line-height:18px;color:#5c3b33}
.loading_tatiana{position:fixed;inset:0;z-index:60;background:var(--kitchen) center/cover;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
.loading_tatiana::before{content:"";position:absolute;inset:0;background:rgba(90,55,48,.35)}
.loading_tatiana i{position:relative;width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,244,224,.35);border-top-color:#fff4e0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading_tatiana.hide_tatiana{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>

    <section class="oven_tatiana"><div class="ovenScroll_tatiana">

<script>(() => {
'use strict';
const A = window.__A__;
const $ = s => document.querySelector(s);
document.documentElement.style.setProperty('--kitchen', `url(${A.kitchen})`);
const EGGS = [
  { id: 'runny', label: 'Runny yolk', sec: 6 * 60 },
  { id: 'soft', label: 'Soft boiled', sec: 8 * 60 },
  { id: 'hard', label: 'Hard boiled', sec: 10 * 60 },
  { id: 'overcooked', label: 'Overcooked', sec: 15 * 60 },
];
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

let ctx = null; const buf = {}; let bgNode = null, alarmNode = null;
const VOL = { bg: .26, tap: .4, start: .35, tick: .42, 'alert-tick': .75, alarm: 1, done: .55 };
async function unlock() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ctx = new AC();
  await Promise.all(Object.keys(VOL).map(async k => {
    try { const b64 = A['snd_' + k].split(',')[1]; const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      buf[k] = await ctx.decodeAudioData(u.buffer); } catch (e) {}
  }));
  if (buf.bg && !bgNode) bgNode = play('bg', true);
}
function play(k, loop) {
  if (!ctx || !buf[k]) return null;
  const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = buf[k]; s.loop = !!loop; g.gain.value = VOL[k];
  s.connect(g).connect(ctx.destination); s.start(); return s;
}
const sfx = { tap: () => play('tap'), start: () => play('start'), tick: left => play(left <= 10 ? 'alert-tick' : 'tick'),
  done: () => { play('done'); if (!alarmNode) alarmNode = play('alarm', true); },
  stopAlarm: () => { if (alarmNode) { try { alarmNode.stop(); } catch (e) {} alarmNode = null; } } };
['pointerdown', 'keydown'].forEach(t => addEventListener(t, unlock, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!ctx) return; document.hidden && !alarmNode && !running ? ctx.suspend() : ctx.resume(); });

let egg = EGGS[0], total = egg.sec, remaining = total, running = false, done = false, dismissed = false, endAt = 0, timer = 0;
const img = $('#egg'), frame = $('#eggFrame'), timeEl = $('#time'), fill = $('#fill'), controls = $('#controls'), alarm = $('#alarm'), glowEl = $('#dglow');

const row = $('#row');
EGGS.forEach(e => {
  const b = document.createElement('button'); b.className = 'cardWrap_tatiana'; b.type = 'button'; b.dataset.id = e.id;
  b.setAttribute('aria-label', `${e.label}, ${e.sec / 60} minutes`);
  b.innerHTML = `<div class="card_tatiana"><img src="${A[e.id]}" alt=""><span class="l_tatiana">${e.label}</span><span class="m_tatiana">${e.sec / 60} min</span></div>`;
  b.addEventListener('click', () => select(e)); row.appendChild(b);
});
{ let down = false, x0 = 0, s0 = 0, moved = false;
  row.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; x0 = e.clientX; s0 = row.scrollLeft; });
  addEventListener('pointermove', e => { if (!down) return; const d = e.clientX - x0; if (Math.abs(d) > 4) moved = true; row.scrollLeft = s0 - d; });
  addEventListener('pointerup', () => { down = false; });
  row.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true); }

function select(e) {
  sfx.stopAlarm(); sfx.tap();
  if (e.id !== egg.id) { img.classList.add('swap_tatiana'); setTimeout(() => { img.src = A[e.id]; img.classList.remove('swap_tatiana'); }, 180); }
  egg = e; total = e.sec; remaining = e.sec; running = false; done = false; dismissed = false; clearInterval(timer);
  render();
}

function tick() {
  const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  if (left < remaining && left >= 1) sfx.tick(left);
  remaining = left;
  if (remaining <= 0) { clearInterval(timer); running = false; done = true; dismissed = false; finish(); }
  render();
}
function startRun() { endAt = Date.now() + remaining * 1000; clearInterval(timer); timer = setInterval(tick, 250); running = true; }
function toggle() {
  if (!running) {
    sfx.stopAlarm();
    if (remaining <= 0) { remaining = total; done = false; dismissed = false; }
    sfx.start(); buzz(15); startRun();
  } else { sfx.tap(); buzz(15); tick(); clearInterval(timer); running = false; }
  render();
}
function reset() { sfx.stopAlarm(); sfx.tap(); clearInterval(timer); running = false; done = false; dismissed = false; remaining = total; buzz(8); render(); }
function cookAnother() { sfx.stopAlarm(); sfx.tap(); done = false; dismissed = false; remaining = total; sfx.start(); buzz(25); startRun(); render(); }
function finish() {
  sfx.done(); buzz([80, 60, 80, 60, 160]);
  frame.classList.remove('bounce_tatiana'); void frame.offsetWidth; frame.classList.add('bounce_tatiana');
  glowEl.classList.remove('go_tatiana'); void glowEl.offsetWidth; glowEl.classList.add('go_tatiana');
}
function dismiss() { if (!done || dismissed) return; sfx.stopAlarm(); dismissed = true; buzz(8); render(); }
alarm.addEventListener('click', dismiss);
addEventListener('keydown', e => { if ((e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') && done && !dismissed) { e.preventDefault(); dismiss(); } });

let lastCtl = '';
function render() {
  const progress = total ? 1 - remaining / total : 0;
  timeEl.textContent = fmt(remaining);
  fill.style.width = Math.round(progress * 100) + '%'; fill.classList.toggle('shimmer_tatiana', running);
  frame.classList.toggle('cooking_tatiana', running);
  document.querySelectorAll('.cardWrap_tatiana').forEach(b => { b.disabled = running; b.querySelector('.card_tatiana').classList.toggle('active_tatiana', b.dataset.id === egg.id); });
  const ctl = done ? 'done' : running ? 'run' : 'idle';
  if (ctl !== lastCtl) {
    lastCtl = ctl;
    controls.innerHTML = done
      ? `<button class="pbtn_tatiana primary_tatiana" id="b1" type="button">COOK ANOTHER EGG</button><button class="pbtn_tatiana danger_tatiana" id="b2" type="button">RESET</button>`
      : `<button class="pbtn_tatiana primary_tatiana" id="b1" type="button">${running ? 'PAUSE' : 'START'}</button><button class="pbtn_tatiana danger_tatiana" id="b2" type="button">RESET</button>`;
    $('#b1').onclick = done ? cookAnother : toggle; $('#b2').onclick = reset;
  }
  alarm.classList.toggle('show_tatiana', done && !dismissed);
  document.title = running ? `${fmt(remaining)} · Egg Timer` : done ? 'Egg ready! · Egg Timer' : 'Egg Timer';
  intensity = running ? progress : 0.05;
}

const cook = $('#cook'), glow = $('#glow'); let intensity = 0.05;
const parts = [];
for (let i = 0; i < 7; i++) { const e = document.createElement('div'); e.className = 'bubble_tatiana'; const s = 8 + (i % 3) * 5; e.style.cssText = `width:${s}px;height:${s}px;left:${16 + i * 52}px`; cook.appendChild(e); parts.push({ e, kind: 'b', delay: i * 140, t: 0 }); }
for (let i = 0; i < 4; i++) { const e = document.createElement('div'); e.className = 'steam_tatiana'; e.style.left = 40 + i * 102 + 'px'; cook.appendChild(e); parts.push({ e, kind: 's', delay: i * 380, t: 0 }); }
const lerp = (x, xs, ys) => { for (let i = 1; i < xs.length; i++) if (x <= xs[i]) { const k = (x - xs[i - 1]) / (xs[i] - xs[i - 1]); return ys[i - 1] + (ys[i] - ys[i - 1]) * k; } return ys[ys.length - 1]; };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, easeSin = t => -(Math.cos(Math.PI * t) - 1) / 2;
let last = performance.now();
function frameLoop(now) {
  const dt = Math.min(100, now - last); last = now; const I = intensity;
  glow.style.opacity = 0.06 + I * 0.28;
  for (const p of parts) {
    const dur = p.kind === 'b' ? 2400 - I * 700 + p.delay : 3600 - I * 1200 + p.delay;
    p.t = (p.t + dt / dur) % 1;
    if (p.kind === 'b') { const v = ease(p.t);
      p.e.style.transform = `translateY(${lerp(v, [0, 1], [0, -170 - I * 50])}px) scale(${lerp(v, [0, .65, 1], [.65, 1.1, .55])})`;
      p.e.style.opacity = lerp(v, [0, .7, 1], [.08, .35 + I * .18, 0]);
    } else { const v = easeSin(p.t);
      p.e.style.transform = `translate(${lerp(v, [0, .5, 1], [0, 6, -6])}px,${lerp(v, [0, 1], [0, -70 - I * 40])}px) scale(${lerp(v, [0, 1], [.7, 1.35])})`;
      p.e.style.opacity = lerp(v, [0, .3, 1], [.06, .3 + I * .18, 0]);
    }
  }
  requestAnimationFrame(frameLoop);
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frameLoop);

img.src = A[egg.id]; render();
const ld = $('#loading'); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => ld.classList.add('hide_tatiana'), 250));
})();
</script>
