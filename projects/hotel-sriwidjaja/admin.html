:root{
  --forest:#1b3a2a;--forest-d:#10231a;--umber:#3e2723;
  --bronze:#A6906F;--bronze-d:#8B7355;--copper:#c2703f;--copper-l:#dc8a55;--navy:#0b0b1c;
  --teal:#2a8c80;--cream:#eee7db;--muted:#b3a794;--line:rgba(166,144,111,.28);
  --rail:34px;--ease:cubic-bezier(.2,.7,.2,1);
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --script:'Calligraphy Brilliant','EB Garamond',Georgia,serif;
}
html{font-size:15px;-webkit-text-size-adjust:100%}
@media (min-width:1680px){html{font-size:16px}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--serif);color:var(--cream);background:var(--forest-d);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#1b3a2a 0%,#152c20 45%,#3e2723 100%);z-index:-1}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr-only_tatiana{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#deck{position:fixed;inset:0 0 0 var(--rail);overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none}
#deck::-webkit-scrollbar{display:none}
.slide_tatiana{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;
  grid-template-columns:minmax(310px,31%) minmax(0,1fr);column-gap:clamp(24px,3.2vw,60px);
  padding:clamp(18px,3vh,34px) clamp(18px,2.4vw,40px) clamp(18px,3vh,34px) clamp(26px,3.2vw,60px)}

.narr_tatiana{display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto;padding:8px 4px 96px 0;scrollbar-width:none}
.narr_tatiana::-webkit-scrollbar{display:none}
.narr-n_tatiana{font-size:1rem;color:var(--bronze);font-style:italic;font-variant-numeric:oldstyle-nums;margin:0 0 .9rem}
.narr-n_tatiana b{font-weight:400;font-style:normal;color:var(--cream);font-size:1.15rem;margin-right:.15em}
.narr-t_tatiana{font-family:var(--script);font-weight:400;font-size:clamp(2.6rem,3.6vw,3.6rem);line-height:1.3;margin:0 0 1.2rem;padding-top:.1em;color:#fff;letter-spacing:.01em}
.narr-lead_tatiana{font-size:clamp(1.14rem,1.3vw,1.32rem);line-height:1.55;margin:0 0 1rem;max-width:36ch;color:var(--cream)}
.narr-note_tatiana{font-size:1.02rem;line-height:1.6;color:var(--muted);margin:0 0 1.4rem;max-width:40ch;font-style:italic}
.narr-try_tatiana{border-top:1px solid var(--line);padding-top:1rem;max-width:40ch}
.narr-try-h_tatiana{margin:0 0 .5rem;font-style:italic;color:var(--bronze);font-size:.98rem}
.narr-try_tatiana ul{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.try_tatiana{display:flex;gap:.7rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:.38rem 0;color:var(--cream);font-size:1.02rem;line-height:1.45}
.try_tatiana::before{content:"";flex:none;width:7px;height:7px;background:var(--copper);transform:translateY(-1px) rotate(45deg);transition:transform .3s var(--ease)}
.try_tatiana:hover{color:var(--copper-l)}
.try_tatiana:hover::before{transform:translateY(-1px) rotate(225deg)}
.narr_tatiana > *{transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.slide_tatiana:not(.seen_tatiana) .narr_tatiana > *{opacity:0;transform:translateY(12px)}

      const label = pay ? { confirmed: 'Lunas', rejected: 'Ditolak' }[s] : { checked_in: 'Check-In', checked_out: 'Check-Out', rejected: 'Ditolak' }[s];
      const needReason = s === 'rejected';
      return modal(`<div class="mdl-c_tatiana" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><h3 id="mdl-t">${pay ? 'Konfirmasi Pembayaran' : 'Konfirmasi Status Booking'}</h3>
        <p>${pay ? 'Yakin ingin mengubah status pembayaran' : 'Yakin ingin mengubah status pesanan'} <b data-noi18n>${esc(b.nama)}</b> <span>menjadi</span> "<span>${label}</span>"?</p>
        ${needReason ? `<label for="mdl-r">Alasan Penolakan (Wajib)</label><textarea id="mdl-r" placeholder="Masukkan alasan penolakan..."></textarea><p class="err_tatiana" hidden>Alasan penolakan wajib diisi.</p>` : ''}
        <div class="mdl-acts_tatiana"><button class="mdl-no_tatiana">Batal</button><button class="mdl-yes_tatiana">Ya, Lanjutkan</button></div></div>`, () => {
        let reason = '';
        if (needReason) { reason = $('#mdl-r').value.trim(); if (!reason) { $('.err_tatiana', mdl).hidden = false; $('#mdl-r').focus(); return; } }
        loadState(); const bb = S.bookings.find(x => x.id === b.id) || b;
        if (pay) { bb.payment_status = s; if (s === 'confirmed') bb.status = 'confirmed'; if (s === 'rejected') { bb.status = 'rejected'; bb.alasan_tolak = reason; } }
        else { bb.status = s; if (reason) bb.alasan_tolak = reason; }
        persist(); markFresh(bb.id); closeOverlays(); render();
      });
    }
    case 'adm-reset':
      return modal(`<div class="mdl-c_tatiana" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><h3 id="mdl-t">Reset Semua Data Reservasi?</h3><p>Tindakan ini akan <strong>menghapus seluruh histori reservasi dan mereset total uang masuk menjadi Rp 0</strong>. Data yang dihapus tidak dapat dikembalikan.</p><div class="mdl-acts_tatiana"><button class="mdl-no_tatiana">Batal</button><button class="mdl-yes_tatiana" style="background:#b91c1c">Ya, Reset</button></div></div>`,
        () => { loadState(); S.bookings = []; persist(); closeOverlays(); render({ top: true }); toast('Data berhasil direset.'); });
  }
}
document.addEventListener('click', e => {
  const t = e.target;
  const l = t.closest('[data-lang]');
  if (l) { e.preventDefault(); if (l.dataset.lang !== X.getLang()) { X.setLangStore(l.dataset.lang); X.applyLang(); render(); } return; }
  const a = t.closest('[data-act]');
  if (a && !a.disabled) { e.preventDefault(); doAction(a.dataset.act, a); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="admin-login"]'); if (!f) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const email = String(v.email || '').trim().toLowerCase();
  if (!email || !v.password) { S.ui.admErr = 'Email dan kata sandi wajib diisi.'; }
  else if (email !== 'admin@hotelsriwidjaja.com' || v.password !== 'sriwidjaja') S.ui.admErr = 'Gagal masuk. Periksa kembali email dan password.';
  else { S.ui.admErr = ''; S.admin = true; S.ui.adminView = 'ringkasan'; X.persistAdmin(); return render({ top: true }); }
  render(); const nf = $('[data-form="admin-login"]'); if (nf) { nf.email.value = v.email; nf.password.value = v.password; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });
X.onExternalChange(kind => { if (kind === 'lang') X.applyLang(); render(); });

loadState();
S.ui.admErr = '';
S.admin = true; X.persistAdmin();
applyPath(location.hash.slice(1));
X.applyLang();
render({ top: true });
})();
</script>
</body>
</html>
